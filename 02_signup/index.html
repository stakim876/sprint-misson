<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>02 회원가입 | 판다마켓</title>
    <link rel="icon" href="../images/logo.png" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/02_auth.css" />
  </head>
  <body>
    <main class="auth">
      <a href="../01_landing/" class="auth__logo">
        <img class="auth__logo-img" src="../images/logo-lg.png" alt="" />
        <span class="auth__logo-text">판다마켓</span>
      </a>

      <div class="auth__content">
        <form class="auth__form" action="#" method="post">
          <div class="field">
            <label class="field__label" for="email">이메일</label>
            <div class="field__control">
              <input
                class="field__input"
                id="email"
                name="email"
                type="email"
                placeholder="이메일을 입력해주세요"
              />
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="nickname">닉네임</label>
            <div class="field__control">
              <input
                class="field__input"
                id="nickname"
                name="nickname"
                type="text"
                placeholder="닉네임을 입력해주세요"
              />
            </div>
          </div>

          <div class="field">
            <label class="field_label" for="passwprd">비밀번호</label>
            <div class="field_control">
                <input
                  class="field_input"
                  id="password"
                  name="password"
                  type="password"
                  placeholder="비밀번호를 입력해주세요"
                  />
                  <img
                    class="field_toggle"
                    src="../icons/ic_btn_visibility_off.png"
                    alt="비밀번호 보기"
                    data-password-toggle="password"
                    />
            </div>
          </div>

          <div class="field">
            <label class="field_label" for="passwordConfirm">비밀번호 확인</label>
            <div class="field_control">
              <input
                class="field_input"
                id="passwordConfirm"
                name="passwordConfirm"
                type="password"
                placeholder="비밀번호를 다시 한 번 입력해주세요"
                />
                <img
                  class="field_toggle"
                  src="../icons/ic_btn_visibility_off.png"
                  alt="비밀번호 보기"
                  data-password-toggle="passwordConfirm"
                  />  
            </div>
          </div>
