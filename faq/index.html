<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ | 판다마켓</title>
    <link rel="icon" href="../04_items/logo.png" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
      />
      <link rel="stylesheet" href="../css/reset.css" />
      <link rel="stylesheet" href="../css/common.css" />
</head>
<body>
  <header class="gnb">
    <div class="gnb_inner">
      <a href="../01_landing/" class="logo">
         <img src="../logo.png" alt="" class="logo_img" />
         <span class="logo_text">판다마켓</span>
      </a>  
      <a href="../02_login/" class="btn-login">로그인</a>
    </div>
  </header>  

  <main class="page">
    <div class="page_inner" style="max-width: 72rem">
      <h1 style="font-size: 2.4rem; margin-bottom: 1.6rem">FAQ</h1>
      <section style="margin-bottom: 2rem">
        <h2 style="font-size: 1.8rem; margin-bottom: 0.8rem">회원가입은 어떻게 하나요?</h2>
        <p style="line-height: 1.7; color: #4b5563">
          로그인 페이지에서 회원가입으로 이동한 뒤 이메일, 닉네임, 비밀번호를 입력하면 됩니다.  
        </p>
      </section>
       <section style="margin-bottom: 2rem">
          <h2 style="font-size: 1.8rem; margin-bottom: 0.8rem">상품은 어떻게 등록하나요?</h2>
          <p style="line-height: 1.7; color: #4b5563">
            로그인 후 중고마켓의 “상품 등록하기”에서 이미지, 상품명, 소개, 가격, 태그를 입력해 등록하세요.
          </p>
        </section>
        <section style="margin-bottom: 2rem">
          <h2 style="font-size: 1.8rem; margin-bottom: 0.8rem">데이터가 어디에 저장되나요?</h2>
          <p style="line-height: 1.7; color: #4b5563">
            이 미션 사이트는 브라우저 localStorage에 저장합니다. 브라우저 저장소를 지우면 데이터가 초기화됩니다.
          </p>
        </section>
        <a href="../01_landing/" style="color: #3692ff">홈으로 돌아가기</a>
      </div>
    </main>

    <script src="../js/store.js"></script>
    <script src="../js/common.js"></script>
  </body>
</html>
