<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>02 로그인 | 판다마켓</title>
    <link rel="icon" href="../images/logo.png" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/02_auth.css" />
  </head>
  <body>
    <main class="auth">
      <a href="../01_landing/" class="auth__logo">
        <img class="auth__logo-img" src="../images/logo-lg.png" alt="" />
        <span class="auth__logo-text">판다마켓</span>
      </a>

      <div class="auth__content">
        <form class="auth__form" action="#" method="post">
          <div class="field">
            <label class="field__label" for="email">이메일</label>
            <div class="field__control">
              <input
                class="field__input"
                id="email"
                name="email"
                type="email"
                placeholder="이메일을 입력해주세요"
              />
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="password">비밀번호</label>
            <div class="field__control">
              <input
                class="field__input"
                id="password"
                name="password"
                type="password"
                placeholder="비밀번호를 입력해주세요"
              />
              <img
                class="field__toggle"
                src="../icons/ic_btn_visibility_off.png"
                alt="비밀번호 보기"
                data-password-toggle="password"
              />
            </div>
          </div>

          <button class="auth__submit" type="submit">로그인</button>
        </form>

        <div class="social">
          <p class="social__label">간편 로그인하기</p>
          <div class="social__buttons">
            <a href="https://www.google.com/" target="_blank" rel="noopener noreferrer">
              <img src="../icons/ic_google.png" alt="google" />
            </a>
            <a href="https://www.kakaocorp.com/page/" target="_blank" rel="noopener noreferrer">
              <img src="../icons/ic_kakao.png" alt="kakao" />
            </a>
          </div>
        </div>

        <p class="auth_switch">
            판다마켓이 처음이신가요?
            <a class="auth_switch-link" href="../02_signup/">회원가입</a>
        </p>
      </div>
    </main>

    <script src="../js/store.js"></script>
    <script src="../js/common.js"></script>
    <script src="../auth.js"></script>
  </body>
</html>
