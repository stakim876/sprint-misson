<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>05 상품 상세 | 판다마켓</title>
    <link rel="icon" href="../images/logo.png" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/05_item-detail.css" />
  </head>
  <body>
    <header class="gnb">
      <div class="gnb__inner">
        <div class="gnb__left">
          <a href="../01_landing/" class="logo">
            <img src="../images/logo.png" alt="" class="logo__img" />
            <span class="logo__text">판다마켓</span>
          </a>
          <nav class="gnb__nav">
            <a href="../06_board/">자유게시판</a>
            <a href="../04_items/" class="is-active">중고마켓</a>
          </nav>
        </div>
        <a href="../02_login/" class="btn-login">로그인</a>
      </div>
    </header>

    <main class="page">
      <div class="page__inner">
        <section class="detail">
          <div class="detail__image" style="background:#c7d2fe"></div>
          <div class="detail__info">
            <h1 class="detail_name">아이폰 14 Pro</h1>
            <p class="detail_price">980,000원</p>

            <div class="detail_meta">
              <button class="detail_like" type="button">♡ 24</button>  
            </div>

            <h2 class="detail_block-title">상품 소개</h2>
            <p class="detail_desc">
              상태 좋은 아이폰 14 Pro 판매합니다.
              기스 거의 없고 배터리 상태도 양호해요.
              구성품은 본채와 충전기 포함입니다.  
            </p>

            <h2 class="detail_block-title">상품 태그</h2>
            <div class="detail_tage">
                <span class="detail_tag">#전자기기</span>
                <span class="detail_tag">#스마트폰</span>
                <span class="detail_tag">#애플</span>
             </div>
              </div>
        </section>

        <section class="comments">
            <h2 class="comments_title">문의하기</h2>
            <form class="comments_form" action="#" method="post">
              <textarea
                class="comments_textatea"
                placeholder="개인정보를 공유 및 요청하거나, 명예 훼손, 무단 광고, 불법 정보 유포시 모니터링 후 삭제될 수 있으며, 이에 대한 민형사상 책임은 게시자에게 있습니다."
              ></textarea>
              <button class="comments_submit" type="submit" type="submit">등록</button>    
            </form>

            <div class="comments_empty">
              <div class="comments_empty-icon">💬</div>
              <p>아직 문의가 없어요<br />궁금한 점이 있으면 문의를 남겨보세요.</p>
            </div>
        </section>

        <div class="detail_back">
          <a href="../04_items/">목록으로</a>  
        </div>
     </div>
   </main>

   <footer class="footer">
    <div class="footer_inner">
      <p class="footer_copyright">@codeit - 2024</p>  
      <div class="footer_links">
        <a href="../privacy/">Privacy Policy</a>
        <a href="../faq/">FAQ</a>
      </div>
      <div class="footer_sns">
        <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer">
          <img src="../icons/ic_facebook.png" alt="facebook" />  
        </a>
        <a href="https://twitter.com/" target="_blank" rel="noopener noreferrer">
           <img src="../icons/ic_twitter.png" alt="twitter" /> 
        </a>
        <a href="https://www.youtube.com/" target="_blank" rel="noppener noreferrer">
            <img src="../icons/ic_youtube.png" alt="youtube" />
        </a>
        <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">
            <img src="../icons/ic_instagram.png" alt="instagram" />
        </a>
      </div>
    </div>
   </footer>

   <script src="../js/store.js"></script>
   <script src="../js/common.js"></script>
   <script src="../js/05_item-detail.js"></script>
</body>
</html>
