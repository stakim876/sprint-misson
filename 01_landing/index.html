<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>01 랜딩 페이지 | 판다마켓</title>
    <link rel="icon" href="../images/logo.png" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/01_landing.css" />
  </head>
  <body>
    <header class="gnb">
      <div class="gnb__inner">
        <a href="../01_landing/" class="logo">
          <img src="../images/logo.png" alt="" class="logo__img" />
          <span class="logo__text">판다마켓</span>
        </a>
        <a href="../02_login/" class="btn-login">로그인</a>
      </div>
    </header>

    <main class="page">
      <section class="banner banner--top">
        <div class="banner__inner">
          <div class="banner__content">
            <h1 class="banner__title">
              일상의 모든 물건을<br />
              거래해 보세요
            </h1>
            <a href="../04_items/" class="btn-cta">구경하러 가기</a>
          </div>
          <img
            class="banner__img"
            src="../images/banner-top.png"
            alt="판다마켓 히어로 이미지"
          />
        </div>
      </section>

      <section class="features">
        <article class="feature">
          <div class="feature__card">
            <img class="feature__img" src="../images/card1.png" alt="" />
            <div class="feature__text feature__text--right">
              <p class="feature__label">Hot Item</p>
              <h2 class="feature__title">인기 상품을<br />확인해 보세요</h2>
              <p class="feature__desc">
                가장 HOT한 중고거래 물품을<br />
                판다 마켓에서 확인해 보세요
              </p>
            </div>
          </div>
        </article>

        <article class="feature">
          <div class="feature__card feature__card--reverse">
            <img class="feature__img" src="../images/card2.png" alt="" />
            <div class="feature__text feature__text--left">
              <p class="feature__label">Search</p>
              <h2 class="feature__title">구매를 원하는<br />상품을 검색하세요</h2>
              <p class="feature__desc">
                구매하고 싶은 물품을 검색해서<br />
                쉽게 찾아보세요
              </p>
            </div>
          </div>
        </article>

        <article class="feature">
          <div class="feature__card">
            <img class="feature__img" src="../images/card3.png" alt="" />
            <div class="feature__text feature__text--right">
              <p class="feature__label">Register</p>
              <h2 class="feature__title">판매를 원하는<br />상품을 등록하세요</h2>
              <p class="feature__desc">
                어떤 물건이든 판매하고 싶은<br />
                상품을 쉽게 등록하세요
              </p>
            </div>
          </div>
        </article>
      </section>

      <section class="banner banner--bottom">
        <div class="banner__inner">
          <div class="banner__content">
            <h2 class="banner__title">
              믿을 수 있는<br />
              판다마켓 중고 거래
            </h2>
          </div>
          <img
            class="banner__img"
            src="../images/banner-bottom.png"
            alt="믿을 수 있는 판다마켓"
          />
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer__inner">
        <p class="footer__copyright">@codeit - 2024</p>
        <div class="footer__links">
          <a href="../privacy/">Privacy Policy</a>
          <a href="../faq/">FAQ</a>
        </div>
        <div class="footer__sns">
          <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer">
            <img src="../icons/ic_facebook.png" alt="facebook" />
          </a>
          <a href="https://twitter.com/" target="_blank" rel="noopener noreferrer">
            <img src="../icons/ic_twitter.png" alt="twitter" />
          </a>
          <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">
            <img src="../icons/ic_youtube.png" alt="youtube" />
          </a>
          <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">
            <img src="../icons/ic_instagram.png" alt="instagram" />
          </a>
        </div>
      </div>
    </footer>

    <script src="../js/store.js"></script>
    <script src="../js/common.js"></script>
  </body>
</html>
